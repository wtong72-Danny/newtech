<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Defenders: Monster Invasion</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03050f;color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 40px #2a5cff55}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em;padding:1em;text-align:center;background:rgba(4,8,32,.86)}
h1{margin:0 0 .3em;font-size:2.3em;line-height:1.05;color:#7df;text-shadow:0 0 18px #2bd4ff,0 3px 0 #135}
h1 small{display:block;font-size:.55em;margin-top:.3em;color:#ff8ad8;text-shadow:0 0 14px #f4c}
p{margin:.2em 0;font-size:1.1em;line-height:1.45}
.btn{font:inherit;font-weight:bold;font-size:1.4em;min-width:11em;padding:.6em 1em;border:0;border-radius:2em;color:#fff;background:linear-gradient(#ff5fd0,#9b3cff);box-shadow:0 5px 0 #4a1a8a,0 0 18px #c4f8;cursor:pointer}
.btn.alt{background:linear-gradient(#3ad0ff,#2a6bff);box-shadow:0 5px 0 #153a8a,0 0 18px #4af8}
.btn:active{transform:translateY(3px)}
#sm{position:absolute;top:8px;right:8px;display:none;gap:8px}
#sm button{width:2.6em;height:2.6em;border-radius:50%;border:2px solid #7df8;background:#0a1440cc;color:#fff;font-size:1.1em;cursor:pointer}
</style></head><body>
<div id="box"><canvas id="c"></canvas>
<div id="sm"><button id="pb" aria-label="Pause">❚❚</button><button id="mb" aria-label="Mute">🔊</button></div>
<div id="ui"></div></div>
<script>
/* =====================================================================
   SKY DEFENDERS: MONSTER INVASION  — single-file game, no libraries.
   HOW TO RUN: save this file as sky-defenders.html and double-click it.
   HOW TO TWEAK: change the numbers in CFG just below. Nothing else needed.
   ===================================================================== */
const CFG={
  playerSpeed:300,        // plane speed on keyboard (pixels/second). Higher = faster plane
  playerMaxHealth:100,    // starting & maximum health
  fireDelay:0.22,         // seconds between shots. Lower = faster firing
  bulletDamage:1,         // WEAPON STRENGTH: damage of each player bullet
  bulletSpeed:620,        // bullet travel speed
  enemyBulletDamage:10,   // damage taken from a monster bullet
  invTime:1.3,            // seconds of protection (blinking) after being hit
  shieldTime:8, weaponTime:12, healAmount:35, // power-up durations / heal size
  dropChance:0.14,        // chance a defeated monster drops a power-up (0-1)
  difficulty:1,           // GLOBAL DIFFICULTY: 0.7 = easy, 1 = normal, 1.4 = hard
                          //   (affects spawn rate, enemy fire rate, bullet speed)
  stageSeconds:[32,38,42],// how long stages 1-3 last before the next stage / boss
  stageHpGrow:0.25,       // monsters get +25% health each stage
  // MONSTER HEALTH (hp), speed, and score for each monster type:
  monsters:{
    drone:{hp:2,speed:90,score:100},   // Buzzer: wavy flyer, shoots straight down
    diver:{hp:3,speed:110,score:150},  // Spikester: hovers, flashes, then dives at you
    squid:{hp:5,speed:70,score:250}    // Cloud Squid: glides sideways, fires 3-shot fans
  },
  bossHealth:140,         // BOSS HEALTH
  bossScore:5000
};

const W=480,H=720; // internal game size; scaled to fit any screen
const $=id=>document.getElementById(id),box=$('box'),cv=$('c'),ctx=cv.getContext('2d'),ui=$('ui');
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let K=1,S=1;
function fit(){S=Math.min(innerWidth/W,innerHeight/H);box.style.width=W*S+'px';box.style.height=H*S+'px';box.style.fontSize=Math.max(11,18*S)+'px';
  const d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*S*d);cv.height=Math.round(H*S*d);K=cv.width/W}
addEventListener('resize',fit);fit();

// ---------- storage (safe if blocked) ----------
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}

// ---------- audio (Web Audio, starts after first click/tap) ----------
let AC,muted=ls('sdMute')==='1';
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type,v,f2){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}
function noise(d,v){const n=AC.sampleRate*d|0,buf=AC.createBuffer(1,n,AC.sampleRate),a=buf.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;g.gain.value=v;
  s.buffer=buf;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}
function sfx(n){if(!AC||muted)return;
  if(n==='shoot')tone(900,.07,'square',.03,350);
  else if(n==='tick')tone(300,.05,'triangle',.05,200);
  else if(n==='boom'){noise(.4,.25);tone(120,.3,'sawtooth',.1,40)}
  else if(n==='hurt'){tone(220,.25,'sawtooth',.14,70);noise(.15,.15)}
  else if(n==='power')[520,660,880].forEach((f,i)=>setTimeout(()=>tone(f,.12,'square',.06),i*70))}
function mute(){muted=!muted;ls('sdMute',muted?'1':'0');$('mb').textContent=muted?'🔇':'🔊'}
$('mb').textContent=muted?'🔇':'🔊';

// ---------- state ----------
let mode='menu',score=0,hi=+ls('sdHi')||0,touch=false,last=performance.now();
let P,E,B,EB,PU,FX,boss,stage,stageT,spawnT,banner=0,bannerTxt='',shake=0,bossOn;
const keys={};

function reset(){P={x:W/2,y:H-110,hp:CFG.playerMaxHealth,inv:0,sh:0,wt:0,wl:1,cd:0};
  E=[];B=[];EB=[];PU=[];FX=[];boss=null;bossOn=false;score=0;startStage(1)}
function startStage(n){stage=n;stageT=0;spawnT=2;banner=2.4;bannerTxt='STAGE '+n}

// ---------- screens ----------
function show(html,btns){ui.innerHTML=html;btns.forEach(([l,f,c])=>{const b=document.createElement('button');b.textContent=l;b.className='btn '+(c||'');b.onclick=f;ui.appendChild(b)});ui.style.display='flex'}
function hide(){ui.style.display='none'}
function menu(){mode='menu';$('sm').style.display='none';
  show(`<h1>SKY DEFENDERS<small>Monster Invasion</small></h1><p>Fly the fighter, blast the monsters,<br>beat the giant boss!</p><p>Best score: <b>${hi}</b></p>`,[['▶ START',begin],['How to play',howto,'alt']])}
function howto(){show(`<h1>How to play</h1><p><b>Computer:</b> WASD or arrow keys to fly, <b>Space</b> to shoot, <b>P</b> pause, <b>M</b> mute.</p><p><b>Phone:</b> drag your finger to fly. The plane shoots by itself!</p><p>Grab: <b style="color:#5f8">+ health</b>, <b style="color:#6cf">S shield</b>, <b style="color:#fd4">★ stronger gun</b>.</p><p>Beat 3 stages, then defeat the boss. After a hit you are protected for a moment.</p>`,[['Back',menu,'alt']])}
function begin(){initAudio();reset();mode='play';hide();$('sm').style.display='flex';last=performance.now()}
function pause(){if(mode!=='play')return;mode='pause';show('<h1>PAUSED</h1>',[['▶ RESUME',resume],['↻ Restart',begin,'alt'],['Menu',menu,'alt']])}
function resume(){hide();mode='play';last=performance.now()}
function end(win){mode=win?'win':'over';const nb=score>hi;if(nb){hi=score;ls('sdHi',hi)}$('sm').style.display='none';
  setTimeout(()=>{if(mode!==(win?'win':'over'))return;
    show(`<h1>${win?'VICTORY!':'GAME OVER'}</h1><p>${win?'You saved the skies!':'The monsters got through...'}</p><p>Score: <b>${score}</b><br>Best: <b>${hi}</b>${nb?' ⭐ New best!':''}</p>`,[['↻ PLAY AGAIN',begin],['Menu',menu,'alt']])},win?600:900)}

// ---------- input ----------
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;touch=false;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
  if(k==='p'||k==='escape'){mode==='pause'?resume():pause()}if(k==='m')mute()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')touch=true});
$('pb').onclick=e=>{e.currentTarget.blur();pause()};
$('mb').onclick=e=>{e.currentTarget.blur();initAudio();mute()};
let ptr=null;
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;ptr={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!ptr||mode!=='play')return;
  P.x=clamp(P.x+(e.clientX-ptr.x)/S,20,W-20);P.y=clamp(P.y+(e.clientY-ptr.y)/S,30,H-30);ptr={x:e.clientX,y:e.clientY}});
const up=()=>ptr=null;cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

// ---------- gameplay helpers ----------
function eb(x,y,ang,sp){const k=(.9+.1*stage)*Math.sqrt(CFG.difficulty);EB.push({x,y,vx:Math.cos(ang)*sp*k,vy:Math.sin(ang)*sp*k})}
function boom(x,y,n,c,s){for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(40,260)*s,l=rnd(.3,.8);FX.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l,m:l,r:rnd(2,6)*s,c:i%3?c:'#fff'})}
  FX.push({x,y,vx:0,vy:0,l:.3,m:.3,r:12*s,c:'#fff',ring:1});shake=Math.max(shake,4*s)}
function spark(x,y){for(let i=0;i<4;i++)FX.push({x,y,vx:rnd(-120,120),vy:rnd(-160,0),l:.25,m:.25,r:3,c:'#ffd'})}
function say(t,x,y,c){FX.push({tx:t,x,y,vx:0,vy:-40,l:1,m:1,c})}
function spawn(t){const c=CFG.monsters[t],hp=Math.ceil(c.hp*(1+CFG.stageHpGrow*(stage-1)));
  const e={t,x:rnd(40,W-40),y:-40,hp,r:t==='squid'?27:t==='diver'?22:20,age:0,ph:rnd(0,6.3),cd:rnd(.8,2),s:0,hit:0,sc:c.score,vx:0};
  e.bx=e.x;e.ty=rnd(100,200);
  if(t==='squid'){const L=Math.random()<.5;e.x=L?-30:W+30;e.y=rnd(80,230);e.vx=(L?1:-1)*c.speed*(1+.1*(stage-1))}
  E.push(e)}
function spawnBoss(){bossOn=true;banner=2.6;bannerTxt='BOSS INCOMING!';const hp=CFG.bossHealth;
  boss={x:W/2,y:-110,w:170,h:110,hp,mhp:hp,t:0,hit:0,c1:2,c2:3,rot:0,ph:1,dying:false,dy:0}}
function dmg(e,d){e.hp-=d;e.hit=.08;
  if(e.hp<=0){e.dead=1;score+=e.sc;boom(e.x,e.y,18,{drone:'#b36bff',diver:'#ff5a5a',squid:'#4fe89a'}[e.t],1);sfx('boom');
    if(Math.random()<CFG.dropChance){const r=Math.random();PU.push({x:e.x,y:e.y,age:0,t:(P.hp<45&&r<.5)?'hp':['hp','sh','wp'][Math.random()*3|0]})}}
  else sfx('tick')}
function hurt(d){if(P.inv>0||mode!=='play')return;
  if(P.sh>0){P.inv=.3;sfx('tick');return}
  P.hp-=d;P.inv=CFG.invTime;shake=12;sfx('hurt');boom(P.x,P.y,8,'#ff6',.8);
  if(P.hp<=0){P.hp=0;boom(P.x,P.y,50,'#ff9a2b',2);sfx('boom');shake=18;end(false)}}
function grab(t){sfx('power');
  if(t==='hp'){P.hp=Math.min(CFG.playerMaxHealth,P.hp+CFG.healAmount);say('+HEALTH',P.x,P.y-30,'#5f8')}
  else if(t==='sh'){P.sh=CFG.shieldTime;say('SHIELD!',P.x,P.y-30,'#6cf')}
  else{P.wl=Math.min(3,P.wl+1);P.wt=CFG.weaponTime;say('GUN LV'+P.wl+'!',P.x,P.y-30,'#fd4')}}
function shoot(){P.cd=CFG.fireDelay*(P.wl>1?.85:1);const d=CFG.bulletDamage,v=CFG.bulletSpeed,add=(x,vx)=>B.push({x,y:P.y-26,vx,vy:-v,d});
  if(P.wl===1)add(P.x,0);else if(P.wl===2){add(P.x-9,0);add(P.x+9,0)}else{add(P.x,0);add(P.x-12,-130);add(P.x+12,130)}sfx('shoot')}

function updBoss(dt){const b=boss;b.t+=dt;b.hit=Math.max(0,b.hit-dt);
  if(b.dying){b.dy-=dt;if(Math.random()<.5)boom(b.x+rnd(-70,70),b.y+rnd(-45,45),8,Math.random()<.5?'#ff9a2b':'#ff4fd8',1.2);shake=Math.max(shake,8);
    if(b.dy<=0){boom(b.x,b.y,70,'#fff',2.5);sfx('boom');boss=null;end(true)}return}
  if(b.y<110){b.y+=60*dt;return}
  b.x=W/2+Math.sin(b.t*.8)*(W/2-110);
  const f=b.hp/b.mhp,ph=f>.66?1:f>.33?2:3,D=CFG.difficulty;
  if(ph!==b.ph){b.ph=ph;shake=14;say('ENRAGED!',b.x,b.y+70,'#f55')}
  b.c1-=dt;b.c2-=dt;
  // Attack A (all phases): aimed 5-bullet fan
  if(b.c1<=0){b.c1=(ph===3?2.2:1.5)/D;const a=Math.atan2(P.y-b.y,P.x-b.x);for(let i=-2;i<=2;i++)eb(b.x,b.y+40,a+i*.22,200)}
  // Attack B (phase 2): ring of 14 bullets
  if(ph===2&&b.c2<=0){b.c2=3/D;b.rot+=.2;for(let i=0;i<14;i++)eb(b.x,b.y+30,b.rot+i*Math.PI*2/14,130)}
  // Attack C (phase 3): two-armed spiral
  if(ph===3&&b.c2<=0){b.c2=.17/D;b.rot+=.45;eb(b.x,b.y+30,b.rot,150);eb(b.x,b.y+30,b.rot+Math.PI,150)}}

function update(dt){
  P.inv=Math.max(0,P.inv-dt);P.sh=Math.max(0,P.sh-dt);P.cd-=dt;banner-=dt;
  if(P.wt>0){P.wt-=dt;if(P.wt<=0)P.wl=1}
  let dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  if(dx&&dy){dx*=.707;dy*=.707}
  P.x=clamp(P.x+dx*CFG.playerSpeed*dt,20,W-20);P.y=clamp(P.y+dy*CFG.playerSpeed*dt,30,H-30);
  if((keys[' ']||touch)&&P.cd<=0)shoot();
  // spawning
  if(!bossOn){stageT+=dt;spawnT-=dt;
    if(spawnT<=0){spawnT=Math.max(.45,(1.6-.3*(stage-1))/CFG.difficulty)*rnd(.8,1.2);
      const r=Math.random(),w=[[.8,1.01],[.45,.75],[.3,.65]][stage-1];spawn(r<w[0]?'drone':r<w[1]?'diver':'squid')}
    if(stageT>=CFG.stageSeconds[stage-1]){if(stage<3)startStage(stage+1);else spawnBoss()}}
  // monsters
  for(const e of E){e.age+=dt;e.hit=Math.max(0,e.hit-dt);const sp=CFG.monsters[e.t].speed*(1+.1*(stage-1));
    if(e.t==='drone'){e.y+=sp*dt;e.x=clamp(e.bx+Math.sin(e.age*2.2+e.ph)*60,20,W-20);e.cd-=dt;
      if(e.cd<=0&&e.y>0&&e.y<H*.6){e.cd=rnd(1.8,3)/CFG.difficulty;eb(e.x,e.y+16,Math.PI/2,190)}}
    else if(e.t==='diver'){
      if(e.s===0){e.y+=sp*1.3*dt;if(e.y>=e.ty){e.s=1;e.cd=.7}}
      else if(e.s===1){e.cd-=dt;e.x+=Math.sin(e.age*40)*30*dt;if(e.cd<=0){e.s=2;const a=Math.atan2(P.y-e.y,P.x-e.x);e.vx=Math.cos(a)*sp*3.2;e.vy=Math.sin(a)*sp*3.2}}
      else{e.x+=e.vx*dt;e.y+=e.vy*dt}}
    else{e.x+=e.vx*dt;e.y+=Math.sin(e.age*2)*30*dt;e.cd-=dt;
      if(e.cd<=0&&e.x>20&&e.x<W-20){e.cd=rnd(1.8,2.6)/CFG.difficulty;const a=Math.atan2(P.y-e.y,P.x-e.x);for(let i=-1;i<=1;i++)eb(e.x,e.y+10,a+i*.3,170)}}}
  if(boss)updBoss(dt);
  for(const b of B){b.x+=b.vx*dt;b.y+=b.vy*dt}
  for(const b of EB){b.x+=b.vx*dt;b.y+=b.vy*dt}
  for(const p of PU){p.y+=70*dt;p.age+=dt}
  // player bullets vs monsters / boss
  for(const b of B){
    for(const e of E){if(!e.dead&&dist(b,e)<e.r+5){b.dead=1;dmg(e,b.d);break}}
    if(!b.dead&&boss&&!boss.dying&&Math.abs(b.x-boss.x)<boss.w*.45&&Math.abs(b.y-boss.y)<boss.h*.42){
      b.dead=1;boss.hp-=b.d;boss.hit=.08;spark(b.x,b.y);sfx('tick');
      if(boss.hp<=0){boss.dying=true;boss.dy=2;EB=[];score+=CFG.bossScore;sfx('boom')}}}
  // damage to player (hit circle is smaller than the plane = forgiving)
  for(const b of EB)if(!b.dead&&dist(b,P)<17){b.dead=1;hurt(CFG.enemyBulletDamage)}
  for(const e of E)if(!e.dead&&dist(e,P)<e.r+12){hurt(20);dmg(e,3)}
  if(boss&&!boss.dying&&Math.abs(P.x-boss.x)<boss.w*.45+10&&Math.abs(P.y-boss.y)<boss.h*.42+10)hurt(20);
  for(const p of PU)if(dist(p,P)<34){p.dead=1;grab(p.t)}
  E=E.filter(e=>!e.dead&&e.y<H+60&&e.y>-80&&e.x>-60&&e.x<W+60);
  B=B.filter(b=>!b.dead&&b.y>-20&&b.x>-20&&b.x<W+20);
  EB=EB.filter(b=>!b.dead&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
  PU=PU.filter(p=>!p.dead&&p.y<H+30)}

// ---------- background & effects ----------
const stars=[...Array(70)].map(()=>({x:rnd(0,W),y:rnd(0,H),s:rnd(.6,2.4)}));
const clouds=[...Array(7)].map(()=>({x:rnd(0,W),y:rnd(0,H),w:rnd(70,160),s:rnd(25,60)}));
function bgStep(dt){for(const s of stars){s.y+=s.s*40*dt;if(s.y>H){s.y=-4;s.x=rnd(0,W)}}
  for(const c of clouds){c.y+=c.s*dt;if(c.y>H+40){c.y=-40;c.x=rnd(0,W)}}}
function fxStep(dt){shake=Math.max(0,shake-40*dt);for(const f of FX){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.985;f.l-=dt}FX=FX.filter(f=>f.l>0)}

// ---------- drawing ----------
const circ=(x,y,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,6.3);ctx.fill()};
const ell=(x,y,rx,ry,c,rot)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,6.3);ctx.fill()};
const pal=[['#0b1a55','#3d86ff'],['#2a0f5c','#ff6fb5'],['#0d0d33','#ff8a3d']];
function drawBG(){const p=pal[(stage||1)-1],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,p[0]);g.addColorStop(1,p[1]);
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);ctx.fillStyle='#fff';
  for(const s of stars){ctx.globalAlpha=.35+s.s/4;ctx.fillRect(s.x,s.y,s.s,s.s)}
  ctx.globalAlpha=.14;for(const c of clouds){ell(c.x,c.y,c.w,c.w*.28,'#fff');ell(c.x+c.w*.5,c.y+8,c.w*.6,c.w*.2,'#fff')}ctx.globalAlpha=1}
function drawPlayer(){
  if(P.sh>0&&(P.sh>2||Math.floor(P.sh*8)%2)){ctx.strokeStyle='rgba(100,200,255,.9)';ctx.lineWidth=3;ctx.fillStyle='rgba(100,200,255,.18)';ctx.beginPath();ctx.arc(P.x,P.y,36,0,6.3);ctx.fill();ctx.stroke()}
  if(P.inv>0&&Math.floor(P.inv*16)%2)return;
  ctx.save();ctx.translate(P.x,P.y);
  ctx.fillStyle='rgba(255,170,60,.95)';ctx.beginPath();ctx.moveTo(-6,18);ctx.lineTo(0,32+Math.random()*12);ctx.lineTo(6,18);ctx.fill();
  ctx.fillStyle='#22b8ff';ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(9,-4);ctx.lineTo(32,18);ctx.lineTo(32,24);ctx.lineTo(9,14);ctx.lineTo(-9,14);ctx.lineTo(-32,24);ctx.lineTo(-32,18);ctx.lineTo(-9,-4);ctx.closePath();ctx.fill();
  circ(-31,22,3,'#ff5fd0');circ(31,22,3,'#ff5fd0');
  ctx.fillStyle='#eaf6ff';ctx.beginPath();ctx.moveTo(0,-32);ctx.lineTo(8,6);ctx.lineTo(6,22);ctx.lineTo(-6,22);ctx.lineTo(-8,6);ctx.closePath();ctx.fill();
  ell(0,-6,4,9,'#3a2a9a');ell(-1,-9,1.5,4,'#9cf');ctx.restore()}
function drawE(e){ctx.save();ctx.translate(e.x,e.y);
  if(e.t==='drone'){const f=Math.sin(e.age*14)*5;
    ell(-20,f-4,13,6,'#d9a0ff',-.5);ell(20,-f-4,13,6,'#d9a0ff',.5);circ(0,0,20,'#8a3cff');ell(0,6,13,10,'#b878ff');
    circ(-7,-3,6,'#fff');circ(7,-3,6,'#fff');circ(-7,0,3,'#102');circ(7,0,3,'#102');
    ctx.strokeStyle='#d9a0ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(0,-28);ctx.stroke();circ(0,-30,4,'#ffe14a')}
  else if(e.t==='diver'){const fl=e.s===1&&Math.floor(e.age*16)%2;
    ctx.fillStyle=fl?'#fff':'#ff4a5a';ctx.beginPath();ctx.moveTo(0,26);ctx.lineTo(18,-4);ctx.lineTo(26,-20);ctx.lineTo(8,-10);ctx.lineTo(0,-24);ctx.lineTo(-8,-10);ctx.lineTo(-26,-20);ctx.lineTo(-18,-4);ctx.closePath();ctx.fill();
    circ(-6,-2,5,'#ffe14a');circ(6,-2,5,'#ffe14a');circ(-6,0,2.2,'#300');circ(6,0,2.2,'#300')}
  else{ctx.fillStyle='#3fe08a';ctx.beginPath();ctx.arc(0,0,26,Math.PI,0);ctx.fill();ctx.fillRect(-26,0,52,8);
    ctx.strokeStyle='#2fb86c';ctx.lineWidth=5;ctx.lineCap='round';
    for(let i=0;i<4;i++){const x=-18+i*12;ctx.beginPath();ctx.moveTo(x,8);ctx.quadraticCurveTo(x+Math.sin(e.age*6+i)*8,20,x,30);ctx.stroke()}
    circ(-9,-6,7,'#fff');circ(9,-6,7,'#fff');circ(-9,-5,3.5,'#102');circ(9,-5,3.5,'#102');circ(0,-20,4,'#a8ffd0')}
  if(e.hit>0)circ(0,0,e.r+4,'rgba(255,255,255,.55)');ctx.restore()}
function drawBoss(){const b=boss,h=b.hit>0;ctx.save();ctx.translate(b.x,b.y);if(b.dying)ctx.translate(rnd(-4,4),rnd(-4,4));
  if(b.ph===3){ctx.globalAlpha=.25+.1*Math.sin(b.t*10);circ(0,0,100,'#f33');ctx.globalAlpha=1}
  ctx.fillStyle=h?'#fff':'#ff4fa8';
  [-1,1].forEach(s=>{ctx.beginPath();ctx.moveTo(s*40,-30);ctx.lineTo(s*88,-52+Math.sin(b.t*5)*8);ctx.lineTo(s*80,10);ctx.lineTo(s*50,30);ctx.closePath();ctx.fill()});
  ctx.fillStyle='#ffd23f';[-1,1].forEach(s=>{ctx.beginPath();ctx.moveTo(s*22,-48);ctx.lineTo(s*38,-84);ctx.lineTo(s*42,-40);ctx.fill()});
  ell(0,0,62,48,h?'#fff':'#9b2cff');ell(0,14,40,26,h?'#fff':'#c47bff');
  [-24,0,24].forEach((x,i)=>{const m=i===1,y=-12-(m?6:0);circ(x,y,m?13:9,'#fff');circ(x,y+2,m?6:4,'#ff2a4a')});
  ctx.fillStyle='#3a0a4a';ctx.beginPath();ctx.ellipse(0,24,26,10,0,0,Math.PI);ctx.fill();
  ctx.fillStyle='#fff';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*9-4,24);ctx.lineTo(i*9+4,24);ctx.lineTo(i*9,31);ctx.fill()}
  ctx.restore()}
function drawPU(p){const y=p.y+Math.sin(p.age*5)*3,c={hp:'#3f9',sh:'#4af',wp:'#fd3'}[p.t];
  circ(p.x,y,22,'rgba(255,255,255,.22)');circ(p.x,y,15,c);ctx.fillStyle='#012';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText({hp:'+',sh:'S',wp:'★'}[p.t],p.x,y+1);ctx.textBaseline='alphabetic'}
function pill(t,x,c){ctx.font='bold 16px system-ui';const w=ctx.measureText(t).width+18;ctx.fillStyle=c;ctx.fillRect(x,H-34,w,24);ctx.fillStyle='#012';ctx.textAlign='left';ctx.fillText(t,x+9,H-16);return w+8}
function hud(){ctx.textAlign='left';ctx.font='bold 22px system-ui';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=4;
  ctx.fillText('SCORE '+score,12,28);ctx.font='bold 14px system-ui';ctx.fillStyle='#bdf';ctx.fillText('BEST '+Math.max(hi,score),12,46);
  ctx.textAlign='center';ctx.font='bold 20px system-ui';ctx.fillStyle='#fff';ctx.fillText('STAGE '+stage+'/3',W/2+30,28);ctx.shadowBlur=0;
  const f=P.hp/CFG.playerMaxHealth;ctx.fillStyle='#0009';ctx.fillRect(12,54,190,20);
  ctx.fillStyle=f>.5?'#3f9':f>.25?'#fc3':'#f54';ctx.fillRect(14,56,186*f,16);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(12,54,190,20);
  ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='left';ctx.fillText('HEALTH',20,69);
  if(boss){const bf=Math.max(0,boss.hp/boss.mhp);ctx.fillStyle='#0009';ctx.fillRect(70,84,W-82,16);ctx.fillStyle='#f4a';ctx.fillRect(72,86,(W-86)*bf,12);
    ctx.strokeStyle='#fff';ctx.strokeRect(70,84,W-82,16);ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.fillText('BOSS',12,98)}
  let x=12;if(P.sh>0)x+=pill('SHIELD '+Math.ceil(P.sh)+'s',x,'#4af');if(P.wl>1)pill('GUN LV'+P.wl+' '+Math.ceil(P.wt)+'s',x,'#fd3');
  if(banner>0){ctx.globalAlpha=Math.min(1,banner);ctx.textAlign='center';ctx.font='bold 48px system-ui';ctx.shadowColor='#4af';ctx.shadowBlur=20;ctx.fillStyle='#fff';ctx.fillText(bannerTxt,W/2,H*.38);ctx.shadowBlur=0;ctx.globalAlpha=1}}
function draw(){ctx.setTransform(K,0,0,K,0,0);ctx.save();
  if(shake>0&&mode!=='pause')ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  drawBG();PU.forEach(drawPU);E.forEach(drawE);if(boss)drawBoss();
  for(const b of EB){circ(b.x,b.y,11,'rgba(255,60,200,.3)');circ(b.x,b.y,6,'#ff4fd8');circ(b.x,b.y,3,'#fff')}
  for(const b of B){ell(b.x,b.y,8,17,'rgba(60,220,255,.3)');ell(b.x,b.y,3,10,'#bff')}
  if(P.hp>0)drawPlayer();
  for(const f of FX){const a=f.l/f.m;ctx.globalAlpha=Math.min(1,a);
    if(f.tx){ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillStyle=f.c;ctx.fillText(f.tx,f.x,f.y)}
    else if(f.ring){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1+(1-a)*3),0,6.3);ctx.stroke()}
    else circ(f.x,f.y,f.r*(.4+a*.6),f.c)}
  ctx.globalAlpha=1;ctx.restore();ctx.setTransform(K,0,0,K,0,0);if(mode!=='menu')hud()}

function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
  if(mode==='pause'){draw();return}   // paused: nothing moves
  bgStep(dt);if(mode==='play')update(dt);fxStep(dt);draw()}

reset();menu();requestAnimationFrame(loop);
</script></body></html>
